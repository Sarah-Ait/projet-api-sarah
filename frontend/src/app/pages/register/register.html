<div class="auth-page">
  <div class="auth-card">
    <div class="brand-header">
      <svg class="brand-logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="18" fill="#a78bfa" />
        <text
          x="20"
          y="27"
          text-anchor="middle"
          fill="#ffffff"
          font-size="20"
          font-weight="700"
          font-family="-apple-system, sans-serif"
        >K</text>
      </svg>
      <span class="brand-name">Kan-be</span>
    </div>

    <h1>Créer un compte</h1>
    <p>Créez un compte pour accéder à votre Kanban.</p>

    <form #registerForm="ngForm" (ngSubmit)="onRegister()">
      <label for="name">Nom</label>
      <input
        id="name"
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="Votre nom"
        required
      />

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        #emailField="ngModel"
        placeholder="email@example.com"
        email
        required
      />
      <p
        class="field-error"
        *ngIf="emailField.invalid && (emailField.dirty || emailField.touched)"
      >
        Adresse email invalide.
      </p>

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Au moins 8 caractères, 1 majuscule, 1 chiffre"
        required
      />

      <ul class="password-rules" *ngIf="password">
        <li [class.met]="hasMinLength">Au moins 8 caractères</li>
        <li [class.met]="hasUppercase">Une majuscule</li>
        <li [class.met]="hasLowercase">Une minuscule</li>
        <li [class.met]="hasDigit">Un chiffre</li>
      </ul>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

      <button
        type="submit"
        [disabled]="registerForm.invalid || !isPasswordValid"
      >
        Créer le compte
      </button>
    </form>

    <a routerLink="/" class="auth-link">Déjà un compte ? Se connecter</a>
  </div>
</div>
